<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 | Snake Game</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    color: #eee;
  }
  h1 {
    margin: 0;
    font-weight: 300;
    letter-spacing: 4px;
  }
  #score {
    font-size: 1.2rem;
    color: #f0c419;
  }
  canvas {
    background: #0f0f1a;
    border: 2px solid #444;
    border-radius: 4px;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #overlay.show { display: flex; }
  button {
    padding: 10px 24px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #f0c419;
    color: #1a1a2e;
    cursor: pointer;
    font-weight: bold;
  }
  #hint {
    font-size: 0.85rem;
    color: #888;
  }
  #speedBar {
    display: flex;
    gap: 8px;
  }
  #speedBar button {
    padding: 6px 18px;
    font-size: 0.9rem;
    background: #333;
    color: #ccc;
  }
  #speedBar button.active {
    background: #f0c419;
    color: #1a1a2e;
  }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div id="score">得分: 0</div>
  <div id="speedBar">
    <button data-speed="slow">慢</button>
    <button data-speed="medium" class="active">中</button>
    <button data-speed="fast">快</button>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <div id="hint">方向键 / WASD 控制,空格暂停,回车重新开始</div>

  <div id="overlay">
    <div id="overlayText" style="font-size:1.5rem;"></div>
    <button id="restartBtn">重新开始</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const restartBtn = document.getElementById('restartBtn');

const GRID = 16;
const CELLS = canvas.width / GRID;

const SPEEDS = { slow: 180, medium: 110, fast: 60 };
let currentSpeed = 'medium';

let snake, direction, nextDirection, food, score, running, paused, tickInterval;

function init() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  direction = {x: 1, y: 0};
  nextDirection = direction;
  score = 0;
  running = true;
  paused = false;
  placeFood();
  updateScore();
  overlay.classList.remove('show');
  if (tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(tick, SPEEDS[currentSpeed]);
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function updateScore() {
  scoreEl.textContent = `得分: ${score}`;
}

function tick() {
  if (!running || paused) return;
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f0413e';
  ctx.fillRect(food.x * GRID, food.y * GRID, GRID - 1, GRID - 1);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7CFC00' : '#4CAF50';
    ctx.fillRect(s.x * GRID, s.y * GRID, GRID - 1, GRID - 1);
  });
}

function gameOver() {
  running = false;
  clearInterval(tickInterval);
  overlayText.textContent = `游戏结束!最终得分: ${score}`;
  overlay.classList.add('show');
}

const KEY_MAP = {
  ArrowUp: {x: 0, y: -1}, w: {x: 0, y: -1}, W: {x: 0, y: -1},
  ArrowDown: {x: 0, y: 1}, s: {x: 0, y: 1}, S: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, a: {x: -1, y: 0}, A: {x: -1, y: 0},
  ArrowRight: {x: 1, y: 0}, d: {x: 1, y: 0}, D: {x: 1, y: 0},
};

window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    init();
    draw();
    return;
  }
  if (e.key === ' ') {
    paused = !paused;
    e.preventDefault();
    return;
  }
  const dir = KEY_MAP[e.key];
  if (!dir) return;
  e.preventDefault();
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
});

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = e.touches[0];
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  const dir = Math.abs(dx) > Math.abs(dy)
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
  touchStart = null;
});

restartBtn.addEventListener('click', () => { init(); draw(); });

document.querySelectorAll('#speedBar button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSpeed = btn.dataset.speed;
    document.querySelectorAll('#speedBar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (tickInterval) clearInterval(tickInterval);
    if (running) tickInterval = setInterval(tick, SPEEDS[currentSpeed]);
  });
});

init();
draw();
</script>
</body>
</html>
