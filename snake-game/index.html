<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐乐专享版本 | 贪吃蛇</title>
<style>
  :root {
    color-scheme: light dark;
    /* 游戏区尺寸,方向键面板与它左右对齐 */
    --board: min(480px, 92vw, 46vh);
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 0;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 190, 140, 0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(215, 200, 185, 0.4), transparent 50%),
      linear-gradient(160deg, #efe9e2 0%, #e2dad1 55%, #d6cdc3 100%);
    background-attachment: fixed;
    color: #4a423b;
  }
  /* 游戏区外部的磨砂玻璃面板 */
  .panel {
    background: rgba(255, 252, 248, 0.42);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 14px;
    box-shadow:
      0 8px 24px rgba(150, 130, 110, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    padding: 7px 16px;
  }
  h1 {
    margin: 0;
    font-family: 'Segoe UI Rounded', 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
    font-weight: 900;
    font-size: 2.4rem;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #ffa552 0%, #e8761a 45%, #b4530a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      1px 1px 0 rgba(255, 255, 255, 0.9),
      2px 3px 5px rgba(150, 100, 60, 0.35);
  }
  #scoreRow {
    display: flex;
    gap: 22px;
    font-size: 1.15rem;
    font-weight: 600;
  }
  #score {
    color: #c26a10;
  }
  #bestScore {
    color: #7a6c5f;
  }
  /* 彩蛋模式徽章,平时隐藏 */
  #specialBadge {
    display: none;
    color: #b4530a;
    font-weight: 700;
    animation: badgePulse 1.4s ease-in-out infinite;
  }
  #specialBadge.show { display: block; }
  @keyframes badgePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  canvas {
    background: #0f0f1a;
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    touch-action: none;
    width: var(--board);
    height: var(--board);
    box-shadow:
      0 10px 28px rgba(120, 95, 70, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }
  #hint {
    max-width: 92vw;
    text-align: center;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(233, 225, 216, 0.82);
    backdrop-filter: blur(18px) saturate(130%);
    -webkit-backdrop-filter: blur(18px) saturate(130%);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #4a423b;
  }
  .modal.show { display: flex; }
  /* 弹窗内部的磨砂卡片 */
  .modal-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
    padding: 32px 34px;
    border-radius: 22px;
    background: linear-gradient(160deg,
      rgba(255, 253, 250, 0.9) 0%,
      rgba(247, 240, 232, 0.82) 100%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      0 16px 40px rgba(140, 115, 90, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }
  #startTitle {
    font-family: 'Segoe UI Rounded', 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 7vw, 2.3rem);
    letter-spacing: 2px;
    white-space: nowrap;
    background: linear-gradient(180deg, #ffa552 0%, #e8761a 45%, #b4530a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      1px 1px 0 rgba(255, 255, 255, 0.9),
      2px 3px 6px rgba(150, 100, 60, 0.35);
  }
  #startSubtitle {
    color: #9a8b7c;
    font-size: 0.9rem;
    letter-spacing: 6px;
    margin-top: -6px;
  }
  #startBestScore {
    color: #c26a10;
    font-size: 1.1rem;
    font-weight: 600;
  }
  #startInstructions {
    font-size: 0.85rem;
    color: #8a7d70;
    max-width: 280px;
  }
  #overlayText {
    color: #5c4a38;
    font-weight: 600;
    white-space: pre-line;
    max-width: 300px;
    line-height: 1.5;
  }
  /* 橙色磨砂玻璃按钮 */
  button {
    padding: 10px 24px;
    font-size: 1rem;
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    background: linear-gradient(180deg,
      rgba(255, 186, 120, 0.72) 0%,
      rgba(240, 138, 48, 0.62) 55%,
      rgba(214, 108, 22, 0.66) 100%);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    color: #5c3210;
    cursor: pointer;
    font-weight: bold;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    box-shadow:
      0 4px 0 rgba(176, 88, 18, 0.55),
      0 7px 14px rgba(160, 90, 40, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transform: translateY(0);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }
  button:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 rgba(176, 88, 18, 0.55),
      0 2px 5px rgba(160, 90, 40, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  #hint {
    font-size: 0.85rem;
    color: #8a7d70;
  }
  #speedBar {
    display: flex;
    gap: 8px;
  }
  /* 未选中的次要按钮:淡一点的磨砂 */
  #speedBar button, #musicBtn {
    padding: 6px 18px;
    font-size: 0.9rem;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.6) 0%,
      rgba(238, 230, 221, 0.45) 100%);
    color: #7a6c5f;
    box-shadow:
      0 3px 0 rgba(180, 165, 150, 0.45),
      0 5px 10px rgba(150, 130, 110, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
  #speedBar button:active, #musicBtn:active {
    box-shadow:
      0 1px 0 rgba(180, 165, 150, 0.45),
      0 2px 4px rgba(150, 130, 110, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  /* 选中态:橙色磨砂高亮 */
  #speedBar button.active, #musicBtn.on {
    background: linear-gradient(180deg,
      rgba(255, 186, 120, 0.78) 0%,
      rgba(240, 138, 48, 0.68) 55%,
      rgba(214, 108, 22, 0.7) 100%);
    color: #5c3210;
    box-shadow:
      0 3px 0 rgba(176, 88, 18, 0.55),
      0 5px 10px rgba(160, 90, 40, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  #boostBtn {
    padding: 0 22px;
    height: 70px;
    font-size: 1rem;
    background: linear-gradient(180deg,
      rgba(255, 170, 90, 0.82) 0%,
      rgba(235, 122, 30, 0.75) 55%,
      rgba(200, 95, 12, 0.78) 100%);
    color: #4d2a0b;
    box-shadow:
      0 5px 0 rgba(160, 78, 12, 0.6),
      0 8px 16px rgba(160, 90, 40, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.75);
    touch-action: none;
    user-select: none;
  }
  #boostBtn:active, #boostBtn.pressed {
    background: linear-gradient(180deg,
      rgba(255, 200, 140, 0.9) 0%,
      rgba(255, 160, 70, 0.82) 55%,
      rgba(235, 122, 30, 0.85) 100%);
    box-shadow:
      0 1px 0 rgba(160, 78, 12, 0.6),
      0 2px 6px rgba(160, 90, 40, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transform: translateY(4px);
  }
  /* 方向键面板:宽度与游戏区一致,左右对齐 */
  #mobileControls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: var(--board);
    padding: 12px 18px;
    border-radius: 18px;
  }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    grid-template-areas:
      ".    up    ."
      "left .     right"
      ".    down  .";
    gap: 6px;
  }
  .dpad-btn {
    font-size: 1.6rem;
    background: linear-gradient(180deg,
      rgba(255, 186, 120, 0.68) 0%,
      rgba(240, 138, 48, 0.58) 55%,
      rgba(214, 108, 22, 0.62) 100%);
    color: #5c3210;
    padding: 0;
    box-shadow:
      0 4px 0 rgba(176, 88, 18, 0.5),
      0 7px 14px rgba(160, 90, 40, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    touch-action: none;
    user-select: none;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: linear-gradient(180deg,
      rgba(255, 205, 150, 0.9) 0%,
      rgba(255, 160, 70, 0.82) 55%,
      rgba(235, 122, 30, 0.85) 100%);
    color: #4d2a0b;
    box-shadow:
      0 1px 0 rgba(176, 88, 18, 0.5),
      0 2px 5px rgba(160, 90, 40, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transform: translateY(3px);
  }
  .dpad-up { grid-area: up; }
  .dpad-left { grid-area: left; }
  .dpad-down { grid-area: down; }
  .dpad-right { grid-area: right; }

  /* ---- 手机端紧凑布局:保证方向键始终在屏幕内 ---- */
  @media (max-width: 760px) {
    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      justify-content: flex-start;
      gap: 8px;
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    }
    :root {
      --board: min(94vw, 50vh);
    }
    h1 {
      font-size: clamp(1.1rem, 5.2vw, 1.45rem);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    /* 顶部得分/调速区尽量紧凑,把空间留给游戏区 */
    .panel {
      padding: 5px 14px;
      border-radius: 12px;
    }
    #scoreRow {
      font-size: 0.92rem;
      gap: 14px;
    }
    #speedBar {
      gap: 5px;
    }
    #speedBar button, #musicBtn {
      padding: 4px 11px;
      font-size: 0.78rem;
      border-radius: 9px;
    }
    /* 方向键靠下但不贴边,整体上移一些更靠近游戏区 */
    #mobileControls {
      margin-top: auto;
      margin-bottom: 26px;
      padding: 12px 16px;
    }
    #dpad {
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 64px);
      gap: 6px;
    }
    .dpad-btn {
      font-size: 1.55rem;
      border-radius: 12px;
    }
    #boostBtn {
      height: 72px;
      padding: 0 20px;
      font-size: 0.95rem;
    }
    /* 手机上没有实体键盘,操作说明改为隐藏以省出空间 */
    #hint { display: none; }
  }

  /* 更矮的屏幕(如 iPhone SE)进一步压缩 */
  @media (max-width: 760px) and (max-height: 700px) {
    :root {
      --board: min(94vw, 44vh);
    }
    h1 { font-size: clamp(1rem, 4.8vw, 1.25rem); }
    #dpad {
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 5px;
    }
    .dpad-btn { font-size: 1.35rem; }
    #boostBtn {
      height: 60px;
      padding: 0 12px;
      font-size: 0.85rem;
    }
    .panel { padding: 4px 12px; }
    #mobileControls {
      margin-bottom: 16px;
      padding: 10px 12px;
    }
  }
</style>
</head>
<body>
  <h1>🐍 乐乐专享版本</h1>
  <div id="scoreRow" class="panel">
    <div id="score">得分: 0</div>
    <div id="bestScore">最高分: 0</div>
    <div id="specialBadge">🥚 独特版</div>
  </div>
  <div id="speedBar" class="panel">
    <button data-speed="slow">慢</button>
    <button data-speed="medium" class="active">中</button>
    <button data-speed="fast">快</button>
    <button id="musicBtn" class="on">🔊 音乐</button>
  </div>
  <canvas id="game" width="480" height="480"></canvas>

  <div id="mobileControls" class="panel">
    <div id="dpad">
      <button class="dpad-btn dpad-up" data-key="ArrowUp">▲</button>
      <button class="dpad-btn dpad-left" data-key="ArrowLeft">◀</button>
      <button class="dpad-btn dpad-down" data-key="ArrowDown">▼</button>
      <button class="dpad-btn dpad-right" data-key="ArrowRight">▶</button>
    </div>
    <button id="boostBtn">⚡<br>加速</button>
  </div>

  <div id="hint">方向键 / WASD 或下方模拟方向键控制(按住加速),空格暂停,回车重新开始</div>

  <div id="overlay" class="modal">
    <div class="modal-card">
      <div id="overlayText" style="font-size:1.4rem;"></div>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>

  <div id="startScreen" class="modal show">
    <div class="modal-card">
      <div id="startTitle">🐍 乐乐专享版本</div>
      <div id="startSubtitle">贪 吃 蛇</div>
      <div id="startBestScore">历史最高分: 0</div>
      <div id="startInstructions">方向键 / WASD / 屏幕方向键控制,按住加速,空格暂停</div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestScoreEl = document.getElementById('bestScore');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const restartBtn = document.getElementById('restartBtn');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const startBestScoreEl = document.getElementById('startBestScore');

let bestScore = Number(localStorage.getItem('snakeBestScore')) || 0;

function updateBestScoreDisplay() {
  bestScoreEl.textContent = `最高分: ${bestScore}`;
  startBestScoreEl.textContent = `历史最高分: ${bestScore}`;
}

function saveBestScoreIfBeaten() {
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('snakeBestScore', String(bestScore));
    updateBestScoreDisplay();
    return true;
  }
  return false;
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

const GRID_NORMAL = 16;
const GRID_SPECIAL = 32;   // 彩蛋:格子放大一倍,蛇的体积也随之变成 2 倍
let GRID = GRID_NORMAL;
let CELLS = canvas.width / GRID;

// --- 彩蛋:连续失败 2 次后,下一局进入"独特版" ---
let deathCount = 0;
let pendingSpecial = false;
let specialMode = false;

const SPEEDS = { slow: 180, medium: 110, fast: 60 };
let currentSpeed = 'medium';
const heldDirectionKeys = new Set();
let touchBoostActive = false;
const BOOST_FACTOR = 0.5;
const MIN_INTERVAL = 30;

let snake, direction, nextDirection, food, score, running, paused, tickInterval;

// --- Audio (synthesized, no external files needed) ---
let audioCtx = null;
let musicOn = true;
let musicTimer = null;
let musicStep = 0;
// 主旋律 + 低音贝斯,循环播放
const MELODY = [
  523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33,
  523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 523.25
];
const BASS = [130.81, 130.81, 164.81, 164.81, 174.61, 174.61, 196.00, 196.00];
const MUSIC_GAIN = 0.11;
const BASS_GAIN = 0.08;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, peakGain) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(peakGain, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playEatSound() {
  if (!audioCtx) return;
  playTone(880, 0.12, 'square', 0.15);
  setTimeout(() => { if (audioCtx) playTone(1320, 0.1, 'square', 0.12); }, 60);
}

function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!audioCtx || !musicOn) return;
    playTone(MELODY[musicStep % MELODY.length], 0.28, 'triangle', MUSIC_GAIN);
    if (musicStep % 2 === 0) {
      playTone(BASS[(musicStep / 2) % BASS.length], 0.45, 'sine', BASS_GAIN);
    }
    musicStep++;
  }, 260);
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}

function unlockAudioOnce() {
  ensureAudio();
  if (musicOn) startMusic();
  window.removeEventListener('keydown', unlockAudioOnce);
  window.removeEventListener('click', unlockAudioOnce);
}
window.addEventListener('keydown', unlockAudioOnce);
window.addEventListener('click', unlockAudioOnce);

function applySpeed() {
  if (!running) return;
  clearInterval(tickInterval);
  const base = SPEEDS[currentSpeed];
  const boosted = heldDirectionKeys.size > 0 || touchBoostActive;
  const interval = boosted ? Math.max(MIN_INTERVAL, base * BOOST_FACTOR) : base;
  tickInterval = setInterval(tick, interval);
}

function init() {
  // 彩蛋生效:本局使用放大的格子,并开启穿墙
  specialMode = pendingSpecial;
  pendingSpecial = false;
  GRID = specialMode ? GRID_SPECIAL : GRID_NORMAL;
  CELLS = canvas.width / GRID;
  updateSpecialBadge();

  const startY = Math.floor(CELLS / 2);
  snake = [{x: 4, y: startY}, {x: 3, y: startY}, {x: 2, y: startY}];
  direction = {x: 1, y: 0};
  nextDirection = direction;
  score = 0;
  running = true;
  paused = false;
  heldDirectionKeys.clear();
  touchBoostActive = false;
  placeFood();
  updateScore();
  overlay.classList.remove('show');
  if (tickInterval) clearInterval(tickInterval);
  applySpeed();
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function updateScore() {
  scoreEl.textContent = `得分: ${score}`;
}

function updateSpecialBadge() {
  document.getElementById('specialBadge').classList.toggle('show', specialMode);
}

function tick() {
  if (!running || paused) return;
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (specialMode) {
    // 独特版:撞墙不死,从另一侧穿出来
    head.x = (head.x + CELLS) % CELLS;
    head.y = (head.y + CELLS) % CELLS;
  } else if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
    gameOver();
    return;
  }

  // 两种模式下,撞到自己都会结束
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    placeFood();
    playEatSound();
    vibrate(30);
  } else {
    snake.pop();
  }

  draw();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSegment(x, y, colorLight, colorDark) {
  const px = x * GRID;
  const py = y * GRID;
  const size = GRID - 1;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 3;
  ctx.shadowOffsetY = 2;
  const grad = ctx.createLinearGradient(px, py, px, py + size);
  grad.addColorStop(0, colorLight);
  grad.addColorStop(1, colorDark);
  ctx.fillStyle = grad;
  roundRectPath(px, py, size, size, 4);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#ffffff';
  roundRectPath(px + 2, py + 1.5, size - 4, (size - 4) * 0.4, 2);
  ctx.fill();
  ctx.restore();
}

function drawFood() {
  const cx = food.x * GRID + GRID / 2;
  const cy = food.y * GRID + GRID / 2;
  const radius = (GRID - 2) / 2;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;
  const grad = ctx.createRadialGradient(
    cx - radius * 0.35, cy - radius * 0.35, radius * 0.1,
    cx, cy, radius
  );
  grad.addColorStop(0, '#ff8a80');
  grad.addColorStop(0.6, '#f0413e');
  grad.addColorStop(1, '#a4201e');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - radius * 0.35, cy - radius * 0.35, radius * 0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawFood();

  snake.forEach((s, i) => {
    if (i === 0) {
      drawSegment(s.x, s.y, '#c6ff7a', '#7cb342');
    } else {
      drawSegment(s.x, s.y, '#8bc34a', '#4c8c2b');
    }
  });
}

function gameOver() {
  running = false;
  clearInterval(tickInterval);
  const isNewRecord = saveBestScoreIfBeaten();

  deathCount++;
  // 每失败 2 次,解锁一局"独特版"(当前若已是独特版则不重复解锁)
  if (!specialMode && deathCount % 2 === 0) {
    pendingSpecial = true;
  }

  let msg = isNewRecord
    ? `🎉 新纪录!得分: ${score}`
    : `游戏结束!得分: ${score}(最高: ${bestScore})`;
  if (pendingSpecial) {
    msg += '\n🥚 彩蛋解锁:下一局是「独特版」——蛇变大一倍,可以穿墙!';
  }
  overlayText.textContent = msg;
  overlay.classList.add('show');
  vibrate([100, 50, 100]);
}

const KEY_MAP = {
  ArrowUp: {x: 0, y: -1}, w: {x: 0, y: -1}, W: {x: 0, y: -1},
  ArrowDown: {x: 0, y: 1}, s: {x: 0, y: 1}, S: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, a: {x: -1, y: 0}, A: {x: -1, y: 0},
  ArrowRight: {x: 1, y: 0}, d: {x: 1, y: 0}, D: {x: 1, y: 0},
};

function pressDirection(key, isRepeat) {
  const dir = KEY_MAP[key];
  if (!dir) return;
  if (!isRepeat && !heldDirectionKeys.has(key)) {
    heldDirectionKeys.add(key);
    applySpeed();
  }
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
}

function releaseDirection(key) {
  if (!(key in KEY_MAP)) return;
  heldDirectionKeys.delete(key);
  applySpeed();
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    ensureAudio();
    if (musicOn) startMusic();
    startScreen.classList.remove('show');
    init();
    draw();
    return;
  }
  if (e.key === ' ') {
    paused = !paused;
    e.preventDefault();
    return;
  }
  if (!(e.key in KEY_MAP)) return;
  e.preventDefault();
  pressDirection(e.key, e.repeat);
});

window.addEventListener('keyup', (e) => releaseDirection(e.key));

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    btn.classList.add('pressed');
    pressDirection(key, false);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    btn.addEventListener(evt, () => {
      btn.classList.remove('pressed');
      releaseDirection(key);
    })
  );
});

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = e.touches[0];
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  const dir = Math.abs(dx) > Math.abs(dy)
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
  touchStart = null;
});

restartBtn.addEventListener('click', () => { init(); draw(); });

const boostBtn = document.getElementById('boostBtn');
function startTouchBoost(e) {
  e.preventDefault();
  ensureAudio();
  touchBoostActive = true;
  boostBtn.classList.add('pressed');
  applySpeed();
}
function endTouchBoost() {
  touchBoostActive = false;
  boostBtn.classList.remove('pressed');
  applySpeed();
}
boostBtn.addEventListener('pointerdown', startTouchBoost);
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
  boostBtn.addEventListener(evt, endTouchBoost)
);

document.querySelectorAll('#speedBar button[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSpeed = btn.dataset.speed;
    document.querySelectorAll('#speedBar button[data-speed]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applySpeed();
  });
});

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', () => {
  musicOn = !musicOn;
  musicBtn.classList.toggle('on', musicOn);
  musicBtn.textContent = musicOn ? '🔊 音乐' : '🔇 静音';
  if (musicOn) { ensureAudio(); startMusic(); } else { stopMusic(); }
});

startBtn.addEventListener('click', () => {
  ensureAudio();
  if (musicOn) startMusic();
  startScreen.classList.remove('show');
  init();
  draw();
});

updateBestScoreDisplay();
</script>
