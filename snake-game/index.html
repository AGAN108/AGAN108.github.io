<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 | Snake Game</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    color: #eee;
  }
  h1 {
    margin: 0;
    font-weight: 300;
    letter-spacing: 4px;
  }
  #score {
    font-size: 1.2rem;
    color: #f0c419;
  }
  canvas {
    background: #0f0f1a;
    border: 2px solid #444;
    border-radius: 4px;
    touch-action: none;
    max-width: 92vw;
    height: auto;
  }
  #hint {
    max-width: 92vw;
    text-align: center;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #overlay.show { display: flex; }
  button {
    padding: 10px 24px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #f0c419;
    color: #1a1a2e;
    cursor: pointer;
    font-weight: bold;
  }
  #hint {
    font-size: 0.85rem;
    color: #888;
  }
  #speedBar {
    display: flex;
    gap: 8px;
  }
  #speedBar button {
    padding: 6px 18px;
    font-size: 0.9rem;
    background: #333;
    color: #ccc;
  }
  #speedBar button.active {
    background: #f0c419;
    color: #1a1a2e;
  }
  #musicBtn {
    padding: 6px 18px;
    font-size: 0.9rem;
    background: #333;
    color: #ccc;
  }
  #musicBtn.on {
    background: #7CFC00;
    color: #1a1a2e;
  }
  #boostBtn {
    padding: 0 20px;
    height: 70px;
    font-size: 1rem;
    background: #e67e22;
    color: #1a1a2e;
    touch-action: none;
    user-select: none;
  }
  #boostBtn:active, #boostBtn.pressed {
    background: #ffb85c;
  }
  #mobileControls {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    grid-template-areas:
      ".    up    ."
      "left .     right"
      ".    down  .";
    gap: 6px;
  }
  .dpad-btn {
    font-size: 1.6rem;
    background: #333;
    color: #eee;
    padding: 0;
    touch-action: none;
    user-select: none;
  }
  .dpad-btn.pressed {
    background: #f0c419;
    color: #1a1a2e;
  }
  .dpad-up { grid-area: up; }
  .dpad-left { grid-area: left; }
  .dpad-down { grid-area: down; }
  .dpad-right { grid-area: right; }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div id="score">得分: 0</div>
  <div id="speedBar">
    <button data-speed="slow">慢</button>
    <button data-speed="medium" class="active">中</button>
    <button data-speed="fast">快</button>
    <button id="musicBtn" class="on">🔊 音乐</button>
  </div>
  <canvas id="game" width="480" height="480"></canvas>

  <div id="mobileControls">
    <div id="dpad">
      <button class="dpad-btn dpad-up" data-key="ArrowUp">▲</button>
      <button class="dpad-btn dpad-left" data-key="ArrowLeft">◀</button>
      <button class="dpad-btn dpad-down" data-key="ArrowDown">▼</button>
      <button class="dpad-btn dpad-right" data-key="ArrowRight">▶</button>
    </div>
    <button id="boostBtn">⚡<br>加速</button>
  </div>

  <div id="hint">方向键 / WASD 或下方模拟方向键控制(按住加速),空格暂停,回车重新开始</div>

  <div id="overlay">
    <div id="overlayText" style="font-size:1.5rem;"></div>
    <button id="restartBtn">重新开始</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const restartBtn = document.getElementById('restartBtn');

const GRID = 16;
const CELLS = canvas.width / GRID;

const SPEEDS = { slow: 180, medium: 110, fast: 60 };
let currentSpeed = 'medium';
const heldDirectionKeys = new Set();
let touchBoostActive = false;
const BOOST_FACTOR = 0.5;
const MIN_INTERVAL = 30;

let snake, direction, nextDirection, food, score, running, paused, tickInterval;

// --- Audio (synthesized, no external files needed) ---
let audioCtx = null;
let musicOn = true;
let musicTimer = null;
let musicStep = 0;
const MELODY = [261.63, 329.63, 392.00, 329.63, 440.00, 392.00, 329.63, 293.66];

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, peakGain) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(peakGain, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playEatSound() {
  if (!audioCtx) return;
  playTone(880, 0.12, 'square', 0.15);
  setTimeout(() => { if (audioCtx) playTone(1320, 0.1, 'square', 0.12); }, 60);
}

function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!audioCtx || !musicOn) return;
    playTone(MELODY[musicStep % MELODY.length], 0.25, 'triangle', 0.04);
    musicStep++;
  }, 300);
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}

function unlockAudioOnce() {
  ensureAudio();
  if (musicOn) startMusic();
  window.removeEventListener('keydown', unlockAudioOnce);
  window.removeEventListener('click', unlockAudioOnce);
}
window.addEventListener('keydown', unlockAudioOnce);
window.addEventListener('click', unlockAudioOnce);

function applySpeed() {
  if (!running) return;
  clearInterval(tickInterval);
  const base = SPEEDS[currentSpeed];
  const boosted = heldDirectionKeys.size > 0 || touchBoostActive;
  const interval = boosted ? Math.max(MIN_INTERVAL, base * BOOST_FACTOR) : base;
  tickInterval = setInterval(tick, interval);
}

function init() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  direction = {x: 1, y: 0};
  nextDirection = direction;
  score = 0;
  running = true;
  paused = false;
  heldDirectionKeys.clear();
  touchBoostActive = false;
  placeFood();
  updateScore();
  overlay.classList.remove('show');
  if (tickInterval) clearInterval(tickInterval);
  applySpeed();
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function updateScore() {
  scoreEl.textContent = `得分: ${score}`;
}

function tick() {
  if (!running || paused) return;
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    placeFood();
    playEatSound();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f0413e';
  ctx.fillRect(food.x * GRID, food.y * GRID, GRID - 1, GRID - 1);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7CFC00' : '#4CAF50';
    ctx.fillRect(s.x * GRID, s.y * GRID, GRID - 1, GRID - 1);
  });
}

function gameOver() {
  running = false;
  clearInterval(tickInterval);
  overlayText.textContent = `游戏结束!最终得分: ${score}`;
  overlay.classList.add('show');
}

const KEY_MAP = {
  ArrowUp: {x: 0, y: -1}, w: {x: 0, y: -1}, W: {x: 0, y: -1},
  ArrowDown: {x: 0, y: 1}, s: {x: 0, y: 1}, S: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, a: {x: -1, y: 0}, A: {x: -1, y: 0},
  ArrowRight: {x: 1, y: 0}, d: {x: 1, y: 0}, D: {x: 1, y: 0},
};

function pressDirection(key, isRepeat) {
  const dir = KEY_MAP[key];
  if (!dir) return;
  if (!isRepeat && !heldDirectionKeys.has(key)) {
    heldDirectionKeys.add(key);
    applySpeed();
  }
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
}

function releaseDirection(key) {
  if (!(key in KEY_MAP)) return;
  heldDirectionKeys.delete(key);
  applySpeed();
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    init();
    draw();
    return;
  }
  if (e.key === ' ') {
    paused = !paused;
    e.preventDefault();
    return;
  }
  if (!(e.key in KEY_MAP)) return;
  e.preventDefault();
  pressDirection(e.key, e.repeat);
});

window.addEventListener('keyup', (e) => releaseDirection(e.key));

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    btn.classList.add('pressed');
    pressDirection(key, false);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    btn.addEventListener(evt, () => {
      btn.classList.remove('pressed');
      releaseDirection(key);
    })
  );
});

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = e.touches[0];
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  const dir = Math.abs(dx) > Math.abs(dy)
    ? { x: dx > 0 ? 1 : -1, y: 0 }
    : { x: 0, y: dy > 0 ? 1 : -1 };
  if (dir.x === -direction.x && dir.y === -direction.y) return;
  nextDirection = dir;
  touchStart = null;
});

restartBtn.addEventListener('click', () => { init(); draw(); });

const boostBtn = document.getElementById('boostBtn');
function startTouchBoost(e) {
  e.preventDefault();
  ensureAudio();
  touchBoostActive = true;
  boostBtn.classList.add('pressed');
  applySpeed();
}
function endTouchBoost() {
  touchBoostActive = false;
  boostBtn.classList.remove('pressed');
  applySpeed();
}
boostBtn.addEventListener('pointerdown', startTouchBoost);
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
  boostBtn.addEventListener(evt, endTouchBoost)
);

document.querySelectorAll('#speedBar button[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSpeed = btn.dataset.speed;
    document.querySelectorAll('#speedBar button[data-speed]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applySpeed();
  });
});

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', () => {
  musicOn = !musicOn;
  musicBtn.classList.toggle('on', musicOn);
  musicBtn.textContent = musicOn ? '🔊 音乐' : '🔇 静音';
  if (musicOn) { ensureAudio(); startMusic(); } else { stopMusic(); }
});

init();
draw();
</script>
</body>
</html>
